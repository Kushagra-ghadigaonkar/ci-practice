name: Artifact Between Jobs

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate file
        run: |
          echo "Hello from Job 1" > output.txt
          echo "This file was created by the generate job." >> output.txt

      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: job-output
          path: output.txt

  consume:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: job-output

      - name: Read artifact
        run: cat output.txt
