name: Docker Publish

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/myapp:latest \
            .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag and push images
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          docker tag \
            ${{ vars.DOCKER_USERNAME }}/myapp:latest \
            ${{ vars.DOCKER_USERNAME }}/myapp:sha-$SHORT_SHA

          docker push ${{ vars.DOCKER_USERNAME }}/myapp:latest
          docker push ${{ vars.DOCKER_USERNAME }}/myapp:sha-$SHORT_SHA
